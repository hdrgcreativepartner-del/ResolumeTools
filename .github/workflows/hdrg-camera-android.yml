name: Build HDRG Camera APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'AndroidCamera/**'
      - '.github/workflows/hdrg-camera-android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > AndroidCamera/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: AndroidCamera
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare distributable APK
        run: cp AndroidCamera/app/build/outputs/apk/debug/app-debug.apk HDRG-Camera-v0.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HDRG-Camera-Debug-APK
          path: HDRG-Camera-v0.2-debug.apk
          if-no-files-found: error
      - name: Publish downloadable APK release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "hdrg-camera-v0.2.0" >/dev/null 2>&1 || gh release create "hdrg-camera-v0.2.0" --title "HDRG Camera v0.2 Beta" --notes "Experimental Android debug APK. Preview, audio, pause/resume, resolution options, timelapse and gallery on Android 10+. Foreground notification required. Hardware runtime verification pending."
          gh release upload "hdrg-camera-v0.2.0" HDRG-Camera-v0.2-debug.apk --clobber
