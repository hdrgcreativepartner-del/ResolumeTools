name: Build HDRG Camera APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'AndroidCamera/**'
      - '.github/workflows/hdrg-camera-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: AndroidCamera
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HDRG-Camera-Debug-APK
          path: AndroidCamera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
