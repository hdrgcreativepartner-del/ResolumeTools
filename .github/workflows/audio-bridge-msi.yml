name: Build Audio Bridge MSI
on:
  workflow_dispatch:
  push:
    paths:
      - 'AudioBridge/audio_bridge_msi.py'
      - 'AudioBridge/build_msi.py'
      - '.github/workflows/audio-bridge-msi.yml'
permissions:
  contents: read
jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip cx_Freeze==7.2.10 imageio-ffmpeg
      - name: Build MSI
        run: python AudioBridge/build_msi.py bdist_msi
      - name: Verify MSI exists
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter '*.msi' -Recurse)
          if ($files.Count -lt 1) { throw 'MSI file not generated' }
          $files | ForEach-Object { Write-Host $_.FullName }
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDRG-Audio-Bridge-MSI-v2.0.0
          path: dist/**/*.msi
          if-no-files-found: error
