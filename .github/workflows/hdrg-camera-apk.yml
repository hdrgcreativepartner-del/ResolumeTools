name: HDRG Camera APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AndroidCamera/**'
      - '.github/workflows/hdrg-camera-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > AndroidCamera/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: AndroidCamera
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HDRG-Camera-debug-apk
          path: AndroidCamera/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
